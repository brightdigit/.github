name: Hosted macOS guard
description: Fail when a private brightdigit repo runs on a GitHub-hosted macOS runner (billed at 10x against the org's included minutes).
inputs:
  allow:
    description: Set to 'true' to deliberately allow GitHub-hosted macOS in this job.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Block GitHub-hosted macOS in private repositories
      if: runner.os == 'macOS' && runner.environment == 'github-hosted' && inputs.allow != 'true'
      shell: bash
      run: |
        PRIVATE=$(jq -r '.repository.private // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)
        if [[ "$PRIVATE" == "true" ]]; then
          echo "::error title=GitHub-hosted macOS blocked::${GITHUB_REPOSITORY} is private and this job is on a GitHub-hosted macOS runner (billed 10x). Use runs-on: [self-hosted, macOS], or set allow: 'true' on brightdigit/.github/actions/hosted-macos-guard."
          exit 1
        fi
        echo "Hosted macOS guard: OK (repository is not private)."
